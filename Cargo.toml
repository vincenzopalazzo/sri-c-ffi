[package]
name = "sv2_sri"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
# the oldest toolchain the committed Cargo.lock is tested on; the SRI
# crates themselves build on 1.75 (stratum-mining/stratum's toolchain),
# which would need a lock resolved for it (version 3, older deps)
rust-version = "1.85"
description = "C API over the Stratum V2 Reference Implementation crates"
repository = "https://github.com/vincenzopalazzo/sri-c-ffi"

[lib]
name = "sv2_sri"
# staticlib is what C links; rlib only serves `cargo test`
crate-type = ["staticlib", "rlib"]

# Stratum V2 Reference Implementation crates, pinned to stratum-mining/stratum
# main as of 2026-11-03, the merge of stratum#2452 (a prebuilt job's own
# ntime_start), after #2455 (a job's target) and #2456 (no target above
# max_target).  Their message structs change between commits, so bump the
# rev and src/messages.rs together.
[dependencies]
# the encrypted transport: handshake states, frame encryption and the
# receive side reassembly
codec_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "7b85f90ca0ae6990a8eab35f00dbc468f83a8145", features = ["noise_sv2"] }
# SRI's own message dispatcher: frame header to message, with the TLV rules
parsers_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "7b85f90ca0ae6990a8eab35f00dbc468f83a8145" }
noise_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "7b85f90ca0ae6990a8eab35f00dbc468f83a8145" }
framing_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "7b85f90ca0ae6990a8eab35f00dbc468f83a8145" }
binary_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "7b85f90ca0ae6990a8eab35f00dbc468f83a8145" }
common_messages_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "7b85f90ca0ae6990a8eab35f00dbc468f83a8145" }
mining_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "7b85f90ca0ae6990a8eab35f00dbc468f83a8145" }
# the server channels: extranonce prefixes, job ids, share validation
channels_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "7b85f90ca0ae6990a8eab35f00dbc468f83a8145" }
# channels_sv2's own, for its Target and hash types
bitcoin = { version = "0.32.5", default-features = false, features = ["std"] }
# SRI's own key encoding (base58check with a version prefix), the format SRI
# pools print and the Bitaxe UI accepts
key-utils = "1.2.0"
# the versions noise_sv2 itself uses, so nothing is compiled twice
secp256k1 = { version = "0.28.2", default-features = false, features = ["std", "rand-std", "hashes"] }
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# panic stays "unwind": every exported function catches a panic and reports
# it as SV2_SRI_ERR_INTERNAL (guard() in src/ffi.rs), so a server drops the
# one connection that hit it.  "abort" would stop the whole process.
